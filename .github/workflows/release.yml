name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    name: 构建 Windows 安装包并发布
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OmniKit ${{ github.ref_name }}'
          releaseBody: 'CI 自动构建的安装包，下载 .exe 安装即可使用。'
          releaseDraft: false
          prerelease: false
